<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MISK Fragrances | Product</title>

<meta name="description"
content="Discover premium MISK Fragrances and find your signature scent.">

<link rel="stylesheet" href="style.css">


<style>

/* =========================================
   PRODUCT PAGE
   ========================================= */

.product-page{

    max-width:1100px;

    margin:70px auto;

    padding:20px;

}


.product-back{

    display:inline-block;

    margin-bottom:35px;

    color:#d4af37;

    text-decoration:none;

}


.product-back:hover{

    text-decoration:underline;

}


.product-detail{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:70px;

    align-items:center;

}


/* =========================================
   PRODUCT IMAGE
   ========================================= */

.product-image-container{

    text-align:center;

}


.product-detail-image{

    width:100%;

    max-width:500px;

    height:550px;

    object-fit:contain;

    display:block;

    margin:auto;

}


/* =========================================
   PRODUCT INFORMATION
   ========================================= */

.product-info h1{

    font-size:48px;

    margin:0 0 20px;

}


.product-description{

    line-height:1.8;

    margin-bottom:30px;

}


/* =========================================
   SIZE OPTIONS
   ========================================= */

.size-title{

    font-size:18px;

    font-weight:bold;

    margin-bottom:15px;

}


.size-options{

    display:flex;

    gap:15px;

    margin-bottom:30px;

    flex-wrap:wrap;

}


.size-option{

    position:relative;

}


.size-option input{

    position:absolute;

    opacity:0;

    pointer-events:none;

}


.size-option label{

    display:block;

    min-width:120px;

    padding:15px 20px;

    border:1px solid #555;

    text-align:center;

    cursor:pointer;

    transition:.2s;

}


.size-option label:hover{

    border-color:#d4af37;

}


.size-option input:checked + label{

    border-color:#d4af37;

    background:#d4af37;

    color:#000;

    font-weight:bold;

}


/* =========================================
   PRICE
   ========================================= */

.selected-price{

    display:block;

    font-size:30px;

    font-weight:bold;

    color:#d4af37;

    margin-bottom:25px;

}


/* =========================================
   ADD TO CART
   ========================================= */

.add-product-cart{

    padding:15px 30px;

    border:none;

    background:#d4af37;

    color:#000;

    font-weight:bold;

    cursor:pointer;

    font-size:16px;

    transition:.2s;

}


.add-product-cart:hover{

    background:#b8860b;

}


/* =========================================
   MOBILE
   ========================================= */

@media(max-width:768px){

    .product-detail{

        grid-template-columns:1fr;

        gap:30px;

    }


    .product-detail-image{

        height:420px;

    }


    .product-info{

        text-align:center;

    }


    .product-info h1{

        font-size:36px;

    }


    .size-options{

        justify-content:center;

    }

}

</style>

</head>


<body>


<header>

<nav class="navbar">

<a href="index.html" class="logo">
MISK
</a>


<div class="nav-links">

<a href="index.html">
Home
</a>

<a href="about.html">
About
</a>

<a href="collection.html">
Collection
</a>

<a href="shop.html">
Shop
</a>

<a href="reviews.html">
Reviews
</a>

<a href="contact.html">
Contact
</a>


<a href="cart.html" class="cart-link">

🛒 Cart

<span
class="cart-count"
id="cartCount">
0
</span>

</a>

</div>

</nav>

</header>


<section class="product-page">


<a
href="shop.html"
class="product-back">

← Back to Shop

</a>


<div class="product-detail">


<div class="product-image-container">

<img
id="productImage"
class="product-detail-image"
src="imagesmisk-bottle.jpg.png"
alt="MISK Fragrance"
>

</div>


<div class="product-info">

<h1 id="productName">
Loading...
</h1>


<p
id="productDescription"
class="product-description">
</p>


<div class="size-title">
Choose your size:
</div>


<div class="size-options">


<div class="size-option">

<input
type="radio"
id="size3ml"
name="size"
value="3ml"
data-price="4"
checked
>

<label for="size3ml">

3ml — £4

</label>

</div>


<div class="size-option">

<input
type="radio"
id="size5ml"
name="size"
value="5ml"
data-price="5"
>

<label for="size5ml">

5ml — £5

</label>

</div>


</div>


<span
id="selectedPrice"
class="selected-price">

£4.00

</span>


<button
id="addProductCart"
class="add-product-cart">

Add to Cart

</button>


</div>

</div>

</section>


<footer>

<div class="footer-brand">
MISK
</div>


<p class="footer-text">
Premium fragrance oils crafted for a lasting impression.
</p>


<div class="footer-links">

<a href="index.html">
Home
</a>

<a href="shop.html">

<a href="reviews.html">

</a>

<a href="contact.html">
Contact
</a>

</div>


<p>
© 2026 MISK Fragrances. All Rights Reserved.
</p>

</footer>


<script>


/* =========================================
   MISK PRODUCTS
   ========================================= */

const products = {


"Royal Oud":{

description:
"Rich woody oud with warm oriental notes for a bold and timeless fragrance."

},


"MISK Noir":{

description:
"A luxurious dark blend of rich florals, woods and amber for elegant evenings."

},


"Imperial Musk":{

description:
"A smooth white musk with clean, soft and long-lasting elegance."

},


"Signature Homme":{

description:
"A refined masculine blend with fresh citrus, woods and amber."

},


"Rose Prestige":{

description:
"A luxurious rose fragrance enriched with soft musk and warm amber."

},


"Legacy":{

description:
"A modern, sophisticated fragrance combining fresh notes with smooth woods."

},


"Obsidian":{

description:
"A deep, smoky blend with dark woods and a mysterious oriental finish."

},


"MISK Royale":{

description:
"An elegant Middle Eastern-inspired fragrance featuring rich oud, musk and warm oriental notes."

},


"Fruity Oud":{

description:
"A vibrant fruity blend balanced with rich oud for a sweet and luxurious finish."

},


"Fruity Femme":{

description:
"A bright and feminine fruity fragrance with sweet, fresh and elegant notes."

}

};


/* =========================================
   SAME IMAGE FOR EVERY FRAGRANCE
   ========================================= */

const bottleImage =
"imagesmisk-bottle.jpg.png";


/* =========================================
   GET PRODUCT FROM URL
   ========================================= */

const params =
new URLSearchParams(
window.location.search
);


const productName =
params.get("name");


const product =
products[productName];


if(product){

    document.title =
        productName +
        " - MISK Fragrances";


    document.getElementById(
        "productName"
    ).textContent =
        productName;


    document.getElementById(
        "productImage"
    ).src =
        bottleImage;


    document.getElementById(
        "productImage"
    ).alt =
        productName +
        " MISK Fragrance";


    document.getElementById(
        "productDescription"
    ).textContent =
        product.description;

}

else{

    document.getElementById(
        "productName"
    ).textContent =
        "Product Not Found";


    document.getElementById(
        "productDescription"
    ).textContent =
        "The fragrance you are looking for could not be found.";

}


/* =========================================
   SIZE / PRICE
   ========================================= */

const sizeOptions =
document.querySelectorAll(
    'input[name="size"]'
);


const selectedPrice =
document.getElementById(
    "selectedPrice"
);


sizeOptions.forEach(
    function(option){

        option.addEventListener(
            "change",
            function(){

                const price =
                    Number(
                        this.dataset.price
                    );


                selectedPrice.textContent =
                    "£" +
                    price.toFixed(2);

            }

        );

    }
);


/* =========================================
   CART
   ========================================= */

let cart = [];


function loadCart(){

    try{

        cart =
            JSON.parse(
                localStorage.getItem(
                    "miskCart"
                )
            ) || [];

    }

    catch(error){

        cart = [];

    }

}


function updateCartCount(){

    const total =
        cart.reduce(
            (sum,item) =>
            sum +
            Number(
                item.quantity || 0
            ),
            0
        );


    document.getElementById(
        "cartCount"
    ).textContent =
        total;

}


loadCart();

updateCartCount();


/* =========================================
   ADD PRODUCT TO CART
   ========================================= */

document.getElementById(
    "addProductCart"
).addEventListener(
    "click",
    function(){

        if(!product){

            return;

        }


        const selectedSize =
            document.querySelector(
                'input[name="size"]:checked'
            );


        const size =
            selectedSize.value;


        const price =
            Number(
                selectedSize.dataset.price
            );


        /*
        Each size is treated as its
        own cart item.
        */

        const existing =
            cart.find(
                item =>
                item.name === productName &&
                item.size === size
            );


        if(existing){

            existing.quantity += 1;

        }

        else{

            cart.push({

                name:productName,

                size:size,

                price:price,

                quantity:1

            });

        }


        localStorage.setItem(
            "miskCart",
            JSON.stringify(cart)
        );


        updateCartCount();


        const button = this;


        button.textContent =
            "✓ Added to Cart";


        setTimeout(
            function(){

                button.textContent =
                    "Add to Cart";

            },
            1200
        );

    }
);


/* =========================================
   KEEP CART COUNT UPDATED
   ========================================= */

window.addEventListener(
    "storage",
    function(){

        loadCart();

        updateCartCount();

    }
);


document.addEventListener(
    "visibilitychange",
    function(){

        if(!document.hidden){

            loadCart();

            updateCartCount();

        }

    }
);

</script>


</body>
</html>
