<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Your Cart - MISK Fragrances</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<nav class="navbar">

<a href="index.html" class="logo">MISK</a>

<div class="nav-links">

<a href="index.html">Home</a>
<a href="about.html">About</a>
<a href="collection.html">Collection</a>
<a href="shop.html">Shop</a>
<a href="reviews.html">Reviews</a>
<a href="contact.html">Contact</a>

<a href="cart.html" class="cart-link active">
🛒 Cart
<span class="cart-count" id="cartCount">0</span>
</a>

</div>

</nav>

</header>


<section class="page-hero">

<div class="hero-content">

<p class="hero-small">
MISK FRAGRANCES
</p>

<h1>Your Cart</h1>

<div class="gold-line"></div>

<p class="hero-tagline">
Your Selected Fragrances
</p>

</div>

</section>


<div class="cart-container">

<div id="cartContainer"></div>

</div>


<footer>

<div class="footer-brand">MISK</div>

<p class="footer-text">
Premium fragrance oils crafted for a lasting impression.
</p>

<div class="footer-links">

<a href="index.html">Home</a>
<a href="about.html">About</a>
<a href="collection.html">Collection</a>
<a href="shop.html">Shop</a>
<a href="reviews.html">Reviews</a>
<a href="contact.html">Contact</a>

</div>

<p>
© 2026 MISK Fragrances. All Rights Reserved.
</p>

</footer>


<button id="backToTop"
aria-label="Back to top"
onclick="window.scrollTo({top:0,behavior:'smooth'})">
↑
</button>


<script>

let cart = [];

function loadCart(){

    try{
        cart =
            JSON.parse(localStorage.getItem("miskCart")) || [];
    }catch(error){
        cart = [];
    }

}

function updateCartCount(){

    const total =
        cart.reduce(
            (sum,item) =>
            sum + Number(item.quantity || 0),
            0
        );

    document.getElementById("cartCount").textContent =
        total;
}

function displayCart(){

    const container =
        document.getElementById("cartContainer");

    if(cart.length === 0){

        container.innerHTML = `

            <div class="card empty">

                <h3>Your cart is empty</h3>

                <p>
                    You haven't added any fragrances yet.
                </p>

                <a href="shop.html"
                   class="btn btn-primary">
                    Browse Shop
                </a>

            </div>

        `;

        updateCartCount();

        return;
    }


    let html = "";
    let total = 0;


    cart.forEach(function(item,index){

        const price =
            Number(item.price) || 0;

        const quantity =
            Number(item.quantity) || 0;

        const itemTotal =
            price * quantity;

        total += itemTotal;


        html += `

            <div class="card cart-item">

                <div class="item-info">

                    <h3>
                        ${escapeHTML(item.name)}
                    </h3>

                    <div class="item-price">
                        £${price.toFixed(2)} each
                    </div>

                </div>


                <div class="quantity">

                    <button
                    onclick="changeQuantity(${index},-1)">
                    −
                    </button>

                    <span>
                        ${quantity}
                    </span>

                    <button
                    onclick="changeQuantity(${index},1)">
                    +
                    </button>

                </div>


                <strong>
                    £${itemTotal.toFixed(2)}
                </strong>


                <button
                class="remove"
                onclick="removeItem(${index})">
                    Remove
                </button>

            </div>

        `;

    });


    html += `

        <div class="cart-total">

            <h3>
                Total: £${total.toFixed(2)}
            </h3>

        </div>

        <div class="cart-buttons">

            <a href="shop.html"
               class="btn btn-secondary">
                Continue Shopping
            </a>

            <a href="checkout.html"
               class="btn btn-primary">
                Proceed to Checkout
            </a>

        </div>

    `;


    container.innerHTML = html;

    updateCartCount();

}


function escapeHTML(text){

    const div =
        document.createElement("div");

    div.textContent =
        text ?? "";

    return div.innerHTML;
}


function changeQuantity(index,change){

    cart[index].quantity =
        Number(cart[index].quantity) + change;

    if(cart[index].quantity <= 0){

        cart.splice(index,1);

    }

    saveCart();

}


function removeItem(index){

    cart.splice(index,1);

    saveCart();

}


function saveCart(){

    localStorage.setItem(
        "miskCart",
        JSON.stringify(cart)
    );

    displayCart();

}


window.addEventListener(
    "storage",
    function(event){

        if(event.key === "miskCart"){

            loadCart();
            displayCart();

        }

    }
);


document.addEventListener(
    "visibilitychange",
    function(){

        if(!document.hidden){

            loadCart();
            displayCart();

        }

    }
);


const backToTop =
document.getElementById("backToTop");

window.addEventListener("scroll",function(){

    backToTop.classList.toggle(
        "show",
        window.scrollY > 400
    );

});


loadCart();
displayCart();

</script>

</body>
</html>
