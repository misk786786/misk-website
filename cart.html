```html
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Your Cart - MISK Fragrances</title>

<style>

:root{
    --gold:#d4af37;
    --gold-dark:#b8860b;
    --silver:#c0c0c0;
    --silver-light:#e5e5e5;
    --bg:#0a0a0a;
    --card:#111;
}

html{
    scroll-behavior:smooth;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--silver-light);
}

/* ==============================
   NAVIGATION
============================== */

nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 35px;
    background:#000;
    border-bottom:1px solid var(--gold);
    position:sticky;
    top:0;
    z-index:1000;
}

nav h1{
    margin:0;
    color:var(--gold);
    letter-spacing:3px;
}

nav div{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
}

nav a{
    color:var(--gold);
    text-decoration:none;
    margin-left:18px;
    font-weight:bold;
    transition:.3s;
}

nav a:hover{
    color:white;
}

/* ==============================
   CART LINK
============================== */

.cart-link{
    border:1px solid var(--gold);
    padding:8px 14px;
    border-radius:5px;
}

.cart-count{
    background:var(--gold);
    color:#000;
    padding:2px 7px;
    border-radius:50%;
    font-size:12px;
    margin-left:4px;
    font-weight:bold;
}

/* ==============================
   CHECKOUT LINK
============================== */

.checkout-link{
    border:1px solid var(--gold);
    padding:8px 14px;
    border-radius:5px;
    background:linear-gradient(
        var(--gold),
        var(--gold-dark)
    );
    color:#000 !important;
}

.checkout-link:hover{
    color:#000 !important;
    transform:translateY(-2px);
}

/* ==============================
   MAIN
============================== */

.container{
    max-width:900px;
    margin:auto;
    padding:60px 20px;
    min-height:600px;
}

h2{
    text-align:center;
    color:var(--gold);
    font-size:34px;
    margin-bottom:40px;
}

/* ==============================
   CART ITEM
============================== */

.cart-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    background:var(--card);
    border:1px solid #333;
    border-radius:8px;
    padding:20px;
    margin-bottom:15px;
    transition:.3s;
}

.cart-item:hover{
    border-color:var(--gold);
}

.item-info{
    flex:1;
}

.item-info h3{
    color:var(--gold);
    margin:0 0 8px;
}

.item-price{
    color:var(--silver);
}

/* ==============================
   QUANTITY
============================== */

.quantity{
    display:flex;
    align-items:center;
    gap:10px;
}

.quantity button{
    width:32px;
    height:32px;
    border:1px solid var(--gold);
    background:#000;
    color:var(--gold);
    cursor:pointer;
    border-radius:4px;
    font-weight:bold;
    font-size:18px;
}

.quantity button:hover{
    background:var(--gold);
    color:#000;
}

.quantity span{
    min-width:25px;
    text-align:center;
}

/* ==============================
   REMOVE
============================== */

.remove{
    background:#000;
    color:#aaa;
    border:1px solid #555;
    padding:8px 12px;
    border-radius:4px;
    cursor:pointer;
}

.remove:hover{
    color:white;
    border-color:var(--gold);
}

/* ==============================
   TOTAL
============================== */

.cart-total{
    text-align:right;
    border-top:1px solid var(--gold);
    margin-top:30px;
    padding-top:25px;
}

.cart-total h3{
    color:var(--gold);
    font-size:24px;
}

/* ==============================
   BUTTONS
============================== */

.buttons{
    display:flex;
    justify-content:flex-end;
    gap:15px;
    margin-top:25px;
}

.btn{
    padding:13px 22px;
    border-radius:5px;
    text-decoration:none;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

.continue{
    border:1px solid var(--gold);
    color:var(--gold);
    background:#000;
}

.continue:hover{
    background:var(--gold);
    color:#000;
}

.checkout{
    background:linear-gradient(
        var(--gold),
        var(--gold-dark)
    );
    color:#000;
    border:none;
}

.checkout:hover{
    transform:translateY(-2px);
    box-shadow:0 5px 15px rgba(212,175,55,.3);
}

/* ==============================
   EMPTY CART
============================== */

.empty{
    text-align:center;
    padding:50px 20px;
    background:var(--card);
    border:1px solid #333;
    border-radius:8px;
}

.empty h3{
    color:var(--gold);
}

.empty p{
    color:var(--silver);
}

.empty a{
    display:inline-block;
    margin-top:20px;
    background:var(--gold);
    color:#000;
    padding:12px 20px;
    text-decoration:none;
    border-radius:5px;
    font-weight:bold;
}

/* ==============================
   BACK TO TOP
============================== */

#backToTop{

    position:fixed;

    right:20px;
    bottom:20px;

    width:48px;
    height:48px;

    border-radius:50%;

    border:1px solid var(--gold);

    background:#080808;

    color:var(--gold);

    font-size:22px;

    font-weight:bold;

    cursor:pointer;

    z-index:2000;

    opacity:0;
    visibility:hidden;

    transform:translateY(10px);

    transition:.3s;

    box-shadow:0 5px 20px rgba(0,0,0,.5);
}

#backToTop.show{

    opacity:1;
    visibility:visible;

    transform:translateY(0);
}

#backToTop:hover{

    background:var(--gold);

    color:#000;

    transform:translateY(-3px);
}

/* ==============================
   FOOTER
============================== */

footer{
    text-align:center;
    padding:30px;
    border-top:1px solid var(--gold);
    color:#777;
    margin-top:50px;
}

/* ==============================
   MOBILE
============================== */

@media(max-width:700px){

    nav{
        flex-direction:column;
        gap:15px;
        text-align:center;
        padding:18px 15px;
    }

    nav h1{
        font-size:22px;
    }

    nav div{
        display:flex;
        flex-wrap:wrap;
        justify-content:center;
    }

    nav a{
        display:inline-block;
        margin:5px 5px;
        font-size:13px;
    }

    .container{
        padding:45px 15px;
    }

    h2{
        font-size:29px;
    }

    .cart-item{
        flex-direction:column;
        align-items:flex-start;
    }

    .quantity{
        margin:5px 0;
    }

    .buttons{
        flex-direction:column;
    }

    .btn{
        text-align:center;
    }

    #backToTop{
        right:15px;
        bottom:15px;
        width:45px;
        height:45px;
    }

}

</style>

</head>

<body>

<!-- ==============================
     NAVIGATION
============================== -->

<nav>

<h1>
MISK Fragrances
</h1>

<div>

<a href="index.html">
Home
</a>

<a href="about.html">
About
</a>

<a href="collection.html">
Collection
</a>

<a href="reviews.html">
Reviews
</a>

<a href="contact.html">
Contact
</a>

<a href="checkout.html" class="checkout-link">
Checkout
</a>

<a href="cart.html" class="cart-link">
🛒 Cart
<span class="cart-count" id="cartCount">0</span>
</a>

</div>

</nav>


<!-- ==============================
     CART
============================== -->

<div class="container">

<h2>
Your Shopping Cart
</h2>

<div id="cartContainer"></div>

</div>


<!-- ==============================
     FOOTER
============================== -->

<footer>

© 2026 MISK Fragrances. All Rights Reserved.

</footer>


<!-- ==============================
     BACK TO TOP
============================== -->

<button
id="backToTop"
onclick="window.scrollTo({top:0,behavior:'smooth'})"
aria-label="Back to top">

↑

</button>


<script>

/* ==============================
   LOAD CART
============================== */

let cart =
    JSON.parse(
        localStorage.getItem("miskCart")
    ) || [];


/* ==============================
   DISPLAY CART
============================== */

function displayCart(){

    const container =
        document.getElementById("cartContainer");

    if(cart.length === 0){

        container.innerHTML = `

        <div class="empty">

            <h3>
            Your cart is empty
            </h3>

            <p>
            You haven't added any fragrances yet.
            </p>

            <a href="collection.html">
            Browse Collection
            </a>

        </div>

        `;

        updateCartCount();

        return;
    }


    let html = "";

    let total = 0;


    cart.forEach((item,index)=>{

        const itemTotal =
            Number(item.price) *
            Number(item.quantity);

        total += itemTotal;


        html += `

        <div class="cart-item">

            <div class="item-info">

                <h3>
                ${item.name}
                </h3>

                <div class="item-price">
                £${Number(item.price).toFixed(2)} each
                </div>

            </div>


            <div class="quantity">

                <button
                onclick="changeQuantity(${index},-1)"
                aria-label="Decrease quantity">

                −

                </button>

                <span>
                ${item.quantity}
                </span>

                <button
                onclick="changeQuantity(${index},1)"
                aria-label="Increase quantity">

                +

                </button>

            </div>


            <strong>
            £${itemTotal.toFixed(2)}
            </strong>


            <button
            class="remove"
            onclick="removeItem(${index})">

            Remove

            </button>

        </div>

        `;

    });


    html += `

    <div class="cart-total">

        <h3>
        Total: £${total.toFixed(2)}
        </h3>

    </div>


    <div class="buttons">

        <a
        href="collection.html"
        class="btn continue">

        Continue Shopping

        </a>

        <a
        href="checkout.html"
        class="btn checkout">

        Proceed to Checkout

        </a>

    </div>

    `;


    container.innerHTML = html;

    updateCartCount();

}


/* ==============================
   CHANGE QUANTITY
============================== */

function changeQuantity(index,change){

    cart[index].quantity =
        Number(cart[index].quantity) + change;


    if(cart[index].quantity <= 0){

        cart.splice(index,1);

    }


    saveCart();

}


/* ==============================
   REMOVE ITEM
============================== */

function removeItem(index){

    cart.splice(index,1);

    saveCart();

}


/* ==============================
   SAVE CART
============================== */

function saveCart(){

    localStorage.setItem(
        "miskCart",
        JSON.stringify(cart)
    );

    displayCart();

}


/* ==============================
   CART COUNT
============================== */

function updateCartCount(){

    const totalItems =
        cart.reduce(
            (total,item) =>
                total + Number(item.quantity || 0),
            0
        );

    const cartCount =
        document.getElementById("cartCount");

    if(cartCount){

        cartCount.textContent =
            totalItems;

    }

}


/* ==============================
   UPDATE CART IF CHANGED
============================== */

window.addEventListener(
    "storage",
    function(event){

        if(event.key === "miskCart"){

            cart =
                JSON.parse(
                    localStorage.getItem("miskCart")
                ) || [];

            displayCart();

        }

    }
);


/* ==============================
   BACK TO TOP
============================== */

const backToTop =
    document.getElementById("backToTop");


window.addEventListener(
    "scroll",
    function(){

        if(window.scrollY > 400){

            backToTop.classList.add("show");

        }else{

            backToTop.classList.remove("show");

        }

    }
);


/* ==============================
   START
============================== */

displayCart();

updateCartCount();

</script>

</body>
</html>
```
