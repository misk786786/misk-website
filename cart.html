<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Your Cart - MISK Fragrances</title>

<meta name="description"
content="View your selected MISK Fragrances and prepare your order.">

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<nav class="navbar">

<a href="index.html" class="logo">MISK</a>

<div class="nav-links">

<a href="index.html">Home</a>
<a href="about.html">About</a>
<a href="collection.html">Collection</a>
<a href="shop.html">Shop</a>
<a href="reviews.html">Reviews</a>
<a href="contact.html">Contact</a>

<a href="cart.html" class="cart-link active">
🛒 Cart
<span class="cart-count" id="cartCount">0</span>
</a>

</div>

</nav>

</header>


<section class="page-hero">

<div class="hero-content">

<p class="hero-small">
MISK FRAGRANCES
</p>

<h1>Your Cart</h1>

<div class="gold-line"></div>

<p class="hero-tagline">
Your Selected Fragrances
</p>

</div>

</section>


<section class="cart-container">

<div id="cartContainer"></div>

</section>


<footer>

<div class="footer-brand">
MISK
</div>

<p class="footer-text">
Premium fragrance oils crafted for a lasting impression.
</p>

<div class="footer-links">

<a href="index.html">Home</a>
<a href="about.html">About</a>
<a href="collection.html">Collection</a>
<a href="shop.html">Shop</a>
<a href="reviews.html">Reviews</a>
<a href="contact.html">Contact</a>

</div>

<p>
© 2026 MISK Fragrances. All Rights Reserved.
</p>

</footer>


<button
id="backToTop"
aria-label="Back to top"
onclick="window.scrollTo({top:0,behavior:'smooth'})">
↑
</button>


<script>

let cart = [];


function loadCart(){

    try{

        cart =
            JSON.parse(
                localStorage.getItem("miskCart")
            ) || [];

    }catch(error){

        cart = [];

    }

}


function saveCart(){

    localStorage.setItem(
        "miskCart",
        JSON.stringify(cart)
    );

}


function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function updateCartCount(){

    const total =
        cart.reduce(
            (sum,item) =>
            sum + Number(item.quantity || 0),
            0
        );

    document.getElementById("cartCount").textContent =
        total;

}


function displayCart(){

    const container =
        document.getElementById("cartContainer");


    if(cart.length === 0){

        container.innerHTML = `

            <div class="card empty">

                <h2>
                    Your cart is empty
                </h2>

                <p>
                    Discover your next MISK fragrance.
                </p>

                <a
                    href="shop.html"
                    class="btn btn-primary">
                    Browse Shop
                </a>

            </div>

        `;

        return;

    }


    let total = 0;


    let html = "";


    cart.forEach(function(item,index){

        const quantity =
            Number(item.quantity || 0);

        const price =
            Number(item.price || 0);

        const itemTotal =
            quantity * price;

        total += itemTotal;


        html += `

            <div class="card cart-item">

                <img
                    src="imagesmisk-bottle.jpg.png"
                    alt="${escapeHTML(item.name)}"
                    class="cart-item-image"
                >

                <div class="cart-item-info">

                    <h3>
                        ${escapeHTML(item.name)}
                    </h3>

                    <p>
                        Size: ${escapeHTML(item.size)}
                    </p>

                    <p>
                        £${price.toFixed(2)} each
                    </p>

                </div>


                <div class="cart-quantity">

                    <button
                        onclick="changeQuantity(${index},-1)"
                        aria-label="Decrease quantity">
                        −
                    </button>

                    <span>
                        ${quantity}
                    </span>

                    <button
                        onclick="changeQuantity(${index},1)"
                        aria-label="Increase quantity">
                        +
                    </button>

                </div>


                <strong>
                    £${itemTotal.toFixed(2)}
                </strong>


                <button
                    class="btn btn-secondary"
                    onclick="removeItem(${index})">
                    Remove
                </button>

            </div>

        `;

    });


    html += `

        <div class="cart-total">

            <h2>
                Total: £${total.toFixed(2)}
            </h2>

            <div class="cart-buttons">

                <a
                    href="shop.html"
                    class="btn btn-secondary">
                    Continue Shopping
                </a>

                <a
                    href="checkout.html"
                    class="btn btn-primary">
                    Proceed to Checkout
                </a>

            </div>

        </div>

    `;


    container.innerHTML = html;

}


function changeQuantity(index,change){

    if(!cart[index]){
        return;
    }


    cart[index].quantity =
        Number(cart[index].quantity || 0)
        + change;


    if(cart[index].quantity <= 0){

        cart.splice(index,1);

    }


    saveCart();

    updateCartCount();

    displayCart();

}


function removeItem(index){

    cart.splice(index,1);

    saveCart();

    updateCartCount();

    displayCart();

}


loadCart();

updateCartCount();

displayCart();


window.addEventListener("storage",function(){

    loadCart();

    updateCartCount();

    displayCart();

});


document.addEventListener("visibilitychange",function(){

    if(!document.hidden){

        loadCart();

        updateCartCount();

        displayCart();

    }

});


const backToTop =
    document.getElementById("backToTop");


window.addEventListener("scroll",function(){

    backToTop.classList.toggle(
        "show",
        window.scrollY > 400
    );

});

</script>

</body>
</html>
