```html
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Your Cart - MISK Fragrances</title>

<style>

:root{
    --gold:#d4af37;
    --gold-dark:#b8860b;
    --silver:#c0c0c0;
    --silver-light:#e5e5e5;
    --bg:#0a0a0a;
    --card:#111;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--silver-light);
}

/* NAVIGATION */

nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 35px;
    background:#000;
    border-bottom:1px solid var(--gold);
}

nav h1{
    margin:0;
    color:var(--gold);
    letter-spacing:3px;
}

nav a{
    color:var(--gold);
    text-decoration:none;
    margin-left:25px;
    font-weight:bold;
}

nav a:hover{
    color:white;
}

/* MAIN */

.container{
    max-width:900px;
    margin:auto;
    padding:60px 20px;
}

h2{
    text-align:center;
    color:var(--gold);
    font-size:34px;
    margin-bottom:40px;
}

/* CART ITEM */

.cart-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    background:var(--card);
    border:1px solid #333;
    border-radius:8px;
    padding:20px;
    margin-bottom:15px;
}

.item-info h3{
    color:var(--gold);
    margin:0 0 8px;
}

.item-price{
    color:var(--silver);
}

.quantity{
    display:flex;
    align-items:center;
    gap:10px;
}

.quantity button{
    width:32px;
    height:32px;
    border:1px solid var(--gold);
    background:#000;
    color:var(--gold);
    cursor:pointer;
    border-radius:4px;
    font-weight:bold;
}

.quantity span{
    min-width:25px;
    text-align:center;
}

.remove{
    background:#000;
    color:#aaa;
    border:1px solid #555;
    padding:8px 12px;
    border-radius:4px;
    cursor:pointer;
}

.remove:hover{
    color:white;
    border-color:var(--gold);
}

/* TOTAL */

.cart-total{
    text-align:right;
    border-top:1px solid var(--gold);
    margin-top:30px;
    padding-top:25px;
}

.cart-total h3{
    color:var(--gold);
    font-size:24px;
}

/* BUTTONS */

.buttons{
    display:flex;
    justify-content:flex-end;
    gap:15px;
    margin-top:25px;
}

.btn{
    padding:13px 22px;
    border-radius:5px;
    text-decoration:none;
    font-weight:bold;
    cursor:pointer;
}

.continue{
    border:1px solid var(--gold);
    color:var(--gold);
    background:#000;
}

.checkout{
    background:linear-gradient(var(--gold),var(--gold-dark));
    color:#000;
    border:none;
}

/* EMPTY */

.empty{
    text-align:center;
    padding:50px 20px;
    background:var(--card);
    border:1px solid #333;
    border-radius:8px;
}

.empty h3{
    color:var(--gold);
}

.empty a{
    display:inline-block;
    margin-top:20px;
    background:var(--gold);
    color:#000;
    padding:12px 20px;
    text-decoration:none;
    border-radius:5px;
    font-weight:bold;
}

/* FOOTER */

footer{
    text-align:center;
    padding:30px;
    border-top:1px solid var(--gold);
    color:#777;
    margin-top:50px;
}

/* MOBILE */

@media(max-width:700px){

nav{
    flex-direction:column;
    gap:15px;
    text-align:center;
}

nav a{
    display:inline-block;
    margin:5px 8px;
}

.cart-item{
    flex-direction:column;
    align-items:flex-start;
}

.buttons{
    flex-direction:column;
}

.btn{
    text-align:center;
}

}

</style>

</head>

<body>

<!-- NAVIGATION -->

<nav>

<h1>MISK Fragrances</h1>

<div>

<a href="index.html">Home</a>
<a href="collection.html">Collection</a>
<a href="reviews.html">Reviews</a>
<a href="cart.html">🛒 Cart</a>

</div>

</nav>


<!-- CART -->

<div class="container">

<h2>Your Shopping Cart</h2>

<div id="cartContainer"></div>

</div>


<footer>

© 2026 MISK Fragrances. All Rights Reserved.

</footer>


<script>

let cart =
JSON.parse(localStorage.getItem("miskCart")) || [];


/* DISPLAY CART */

function displayCart(){

    const container =
        document.getElementById("cartContainer");

    if(cart.length === 0){

        container.innerHTML = `

        <div class="empty">

            <h3>Your cart is empty</h3>

            <p>
            You haven't added any fragrances yet.
            </p>

            <a href="collection.html">
            Browse Collection
            </a>

        </div>

        `;

        return;
    }


    let html = "";

    let total = 0;


    cart.forEach((item,index)=>{

        const itemTotal =
            item.price * item.quantity;

        total += itemTotal;


        html += `

        <div class="cart-item">

            <div class="item-info">

                <h3>
                ${item.name}
                </h3>

                <div class="item-price">
                £${item.price.toFixed(2)} each
                </div>

            </div>


            <div class="quantity">

                <button
                onclick="changeQuantity(${index},-1)">
                −
                </button>

                <span>
                ${item.quantity}
                </span>

                <button
                onclick="changeQuantity(${index},1)">
                +
                </button>

            </div>


            <strong>
            £${itemTotal.toFixed(2)}
            </strong>


            <button
            class="remove"
            onclick="removeItem(${index})">

            Remove

            </button>

        </div>

        `;

    });


    html += `

    <div class="cart-total">

        <h3>
        Total: £${total.toFixed(2)}
        </h3>

    </div>


    <div class="buttons">

        <a
        href="collection.html"
        class="btn continue">

        Continue Shopping

        </a>

        <a
        href="checkout.html"
        class="btn checkout">

        Proceed to Checkout

        </a>

    </div>

    `;


    container.innerHTML = html;

}


/* CHANGE QUANTITY */

function changeQuantity(index,change){

    cart[index].quantity += change;


    if(cart[index].quantity <= 0){

        cart.splice(index,1);

    }


    saveCart();

}


/* REMOVE ITEM */

function removeItem(index){

    cart.splice(index,1);

    saveCart();

}


/* SAVE CART */

function saveCart(){

    localStorage.setItem(
        "miskCart",
        JSON.stringify(cart)
    );

    displayCart();

}


displayCart();

</script>

</body>
</html>
