<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Checkout - MISK Fragrances</title>

<style>

:root{
    --gold:#d4af37;
    --gold-dark:#b8860b;
    --silver:#c0c0c0;
    --silver-light:#e5e5e5;
    --bg:#0a0a0a;
    --card:#111;
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--silver-light);
}

/* ==============================
   NAVIGATION
============================== */

nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 24px;
    background:#000;
    border-bottom:1px solid rgba(212,175,55,.3);
    position:sticky;
    top:0;
    z-index:1000;
}

.logo-button{
    color:var(--gold);
    text-decoration:none;
    font-family:Georgia,"Times New Roman",serif;
    font-size:40px;
    font-weight:bold;
    letter-spacing:8px;
    transition:.3s;
}

.logo-button:hover{
    color:white;
}

.nav-links{
    display:flex;
    align-items:center;
    justify-content:center;
    flex-wrap:wrap;
    gap:5px;
}

.nav-links a{
    color:var(--gold);
    text-decoration:none;
    margin-left:20px;
    font-size:16px;
    font-weight:500;
    transition:.3s;
}

.nav-links a:hover{
    color:white;
}

/* ==============================
   CART
============================== */

.cart-link{
    border:1px solid var(--gold);
    padding:9px 13px;
    border-radius:6px;
}

.cart-count{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    background:var(--gold);
    color:#000;
    min-width:24px;
    height:24px;
    border-radius:50%;
    font-size:12px;
    font-weight:bold;
    margin-left:5px;
}

/* ==============================
   MAIN
============================== */

.container{
    max-width:700px;
    margin:auto;
    padding:65px 20px;
    min-height:600px;
}

h2{
    color:var(--gold);
    text-align:center;
    font-family:Georgia,"Times New Roman",serif;
    font-size:42px;
    letter-spacing:2px;
    margin:0 0 35px;
}

/* ==============================
   CHECKOUT BOX
============================== */

.order-box{
    background:
        linear-gradient(
            145deg,
            #151515,
            #0c0c0c
        );

    border:1px solid rgba(212,175,55,.5);
    border-radius:10px;
    padding:32px;
    box-shadow:
        0 15px 40px rgba(0,0,0,.45);
}

/* ==============================
   FORM
============================== */

.form-group{
    margin-bottom:22px;
}

label{
    display:block;
    color:var(--gold);
    font-weight:bold;
    margin-bottom:8px;
}

.optional{
    color:#888;
    font-size:12px;
    font-weight:normal;
    margin-left:5px;
}

input,
textarea{
    width:100%;
    padding:14px;
    background:#000;
    color:white;
    border:1px solid #444;
    border-radius:5px;
    font-family:Arial,Helvetica,sans-serif;
    font-size:14px;
    transition:.3s;
}

input:focus,
textarea:focus{
    outline:none;
    border-color:var(--gold);
    box-shadow:0 0 8px rgba(212,175,55,.25);
}

textarea{
    min-height:110px;
    resize:vertical;
}

.note-textarea{
    min-height:120px;
}

.note-help{
    color:#777;
    font-size:12px;
    line-height:1.5;
    margin:7px 0 0;
}

/* ==============================
   ORDER SUMMARY
============================== */

.order-summary{
    border-top:1px solid #333;
    margin-top:28px;
    padding-top:22px;
}

.order-summary h3{
    color:var(--gold);
    font-family:Georgia,"Times New Roman",serif;
    font-size:22px;
    margin:0 0 15px;
}

.order-summary p{
    color:var(--silver);
    line-height:1.7;
    margin:8px 0;
}

.order-summary hr{
    border:none;
    border-top:1px solid #333;
    margin:18px 0;
}

.order-total{
    color:var(--gold);
    font-size:20px;
}

/* ==============================
   PLACE ORDER
============================== */

.place-order{
    width:100%;
    margin-top:25px;
    padding:15px;
    background:
        linear-gradient(
            135deg,
            var(--gold),
            var(--gold-dark)
        );
    border:1px solid var(--gold);
    border-radius:5px;
    color:#000;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

.place-order:hover{
    transform:translateY(-2px);
    box-shadow:
        0 7px 20px rgba(212,175,55,.3);
}

/* ==============================
   EMPTY CART MESSAGE
============================== */

.empty-message{
    text-align:center;
    background:#0d0d0d;
    border:1px solid #333;
    border-radius:7px;
    padding:20px;
    color:#999;
}

.empty-message strong{
    color:var(--gold);
}

/* ==============================
   BACK TO CART
============================== */

.back{
    display:block;
    text-align:center;
    margin-top:22px;
    color:var(--gold);
    text-decoration:none;
    transition:.3s;
}

.back:hover{
    color:white;
}

/* ==============================
   BACK TO TOP
============================== */

#backToTop{
    position:fixed;
    right:20px;
    bottom:20px;
    width:48px;
    height:48px;
    border-radius:50%;
    border:1px solid var(--gold);
    background:#080808;
    color:var(--gold);
    font-size:22px;
    font-weight:bold;
    cursor:pointer;
    z-index:2000;

    opacity:0;
    visibility:hidden;

    transform:translateY(10px);

    transition:
        opacity .3s,
        visibility .3s,
        transform .3s,
        background .3s;
}

#backToTop.show{
    opacity:1;
    visibility:visible;
    transform:translateY(0);
}

#backToTop:hover{
    background:var(--gold);
    color:#000;
    transform:translateY(-3px);
}

/* ==============================
   FOOTER
============================== */

footer{
    text-align:center;
    padding:30px;
    border-top:1px solid rgba(212,175,55,.3);
    color:#777;
    font-size:13px;
    margin-top:40px;
}

/* ==============================
   MOBILE
============================== */

@media(max-width:800px){

    nav{
        flex-direction:column;
        gap:14px;
        padding:15px;
    }

    .logo-button{
        font-size:34px;
    }

    .nav-links{
        gap:4px 8px;
    }

    .nav-links a{
        margin:4px 5px;
        font-size:13px;
    }

    .cart-link{
        padding:7px 10px;
    }

    .container{
        padding:50px 15px;
    }

    h2{
        font-size:34px;
    }

    .order-box{
        padding:23px 18px;
    }

}

@media(max-width:400px){

    .logo-button{
        font-size:30px;
        letter-spacing:6px;
    }

    .nav-links a{
        font-size:11px;
        margin:3px;
    }

    h2{
        font-size:30px;
    }

}

</style>

</head>

<body id="top">

<!-- ==============================
     NAVIGATION
============================== -->

<nav>

<a href="index.html" class="logo-button">
MISK
</a>

<div class="nav-links">

<a href="index.html">
Home
</a>

<a href="about.html">
About
</a>

<a href="collection.html">
Collection
</a>

<a href="reviews.html">
Reviews
</a>

<a href="contact.html">
Contact
</a>

<a href="cart.html" class="cart-link">
🛒 Cart
<span class="cart-count" id="cartCount">0</span>
</a>

</div>

</nav>


<!-- ==============================
     CHECKOUT
============================== -->

<div class="container">

<h2>
Checkout
</h2>

<div class="order-box">

<form id="checkoutForm">

<!-- NAME -->

<div class="form-group">

<label for="name">
Full Name
</label>

<input
type="text"
id="name"
required
autocomplete="name"
placeholder="Enter your name">

</div>


<!-- EMAIL -->

<div class="form-group">

<label for="email">
Email Address
</label>

<input
type="email"
id="email"
required
autocomplete="email"
placeholder="Enter your email">

</div>


<!-- ADDRESS -->

<div class="form-group">

<label for="address">
Delivery Address
</label>

<textarea
id="address"
required
autocomplete="street-address"
placeholder="Enter your delivery address"></textarea>

</div>


<!-- POSTCODE -->

<div class="form-group">

<label for="postcode">
Postcode
</label>

<input
type="text"
id="postcode"
required
autocomplete="postal-code"
placeholder="Enter your postcode">

</div>


<!-- OPTIONAL NOTE -->

<div class="form-group">

<label for="note">
Order Note
<span class="optional">
(Optional)
</span>
</label>

<textarea
id="note"
class="note-textarea"
placeholder="Leave a note about your order..."></textarea>

<p class="note-help">
Optional — leave a delivery request or any message you'd like us to see with your order.
</p>

</div>


<!-- ORDER SUMMARY -->

<div class="order-summary">

<h3>
Your Order
</h3>

<div id="orderSummary"></div>

</div>


<!-- SEND ORDER -->

<button
type="submit"
class="place-order">

Send Order Request

</button>

</form>


<a href="cart.html" class="back">
← Back to Cart
</a>

</div>

</div>


<!-- ==============================
     BACK TO TOP
============================== -->

<button
id="backToTop"
onclick="window.scrollTo({top:0,behavior:'smooth'})"
aria-label="Back to top">

↑

</button>


<!-- ==============================
     FOOTER
============================== -->

<footer>

© 2026 MISK Fragrances. All Rights Reserved.

</footer>


<script>

/* ==============================
   LOAD CART SAFELY
============================== */

let cart = [];

try{

    cart =
        JSON.parse(
            localStorage.getItem("miskCart")
        ) || [];

}catch(error){

    cart = [];

}


/* ==============================
   CART COUNT
============================== */

function updateCartCount(){

    const totalItems =
        cart.reduce(
            function(total,item){

                return total +
                    Number(item.quantity || 0);

            },
            0
        );

    const cartCount =
        document.getElementById("cartCount");

    if(cartCount){

        cartCount.textContent =
            totalItems;

    }

}


/* ==============================
   SHOW ORDER
============================== */

function showOrder(){

    const summary =
        document.getElementById("orderSummary");

    if(cart.length === 0){

        summary.innerHTML = `

            <div class="empty-message">

                <strong>Your cart is empty.</strong>

                <br><br>

                Please add a fragrance before checking out.

            </div>

        `;

        return;

    }


    let html = "";

    let total = 0;


    cart.forEach(function(item){

        const price =
            Number(item.price) || 0;

        const quantity =
            Number(item.quantity) || 0;

        const itemTotal =
            price * quantity;

        total += itemTotal;


        html += `

            <p>
                ${escapeHTML(item.name)}
                × ${quantity}
                — £${itemTotal.toFixed(2)}
            </p>

        `;

    });


    html += `

        <hr>

        <div class="order-total">

            <strong>
                Total: £${total.toFixed(2)}
            </strong>

        </div>

    `;


    summary.innerHTML = html;

}


/* ==============================
   ESCAPE TEXT
============================== */

function escapeHTML(text){

    const div =
        document.createElement("div");

    div.textContent =
        text ?? "";

    return div.innerHTML;

}


/* ==============================
   SEND ORDER EMAIL
============================== */

document
.getElementById("checkoutForm")
.addEventListener(
    "submit",
    function(event){

        event.preventDefault();


        if(cart.length === 0){

            alert(
                "Your cart is empty. Please add a fragrance before checking out."
            );

            return;

        }


        const name =
            document
            .getElementById("name")
            .value
            .trim();


        const email =
            document
            .getElementById("email")
            .value
            .trim();


        const address =
            document
            .getElementById("address")
            .value
            .trim();


        const postcode =
            document
            .getElementById("postcode")
            .value
            .trim();


        const note =
            document
            .getElementById("note")
            .value
            .trim();


        let orderText = "";

        let total = 0;


        cart.forEach(function(item){

            const price =
                Number(item.price) || 0;

            const quantity =
                Number(item.quantity) || 0;

            const itemTotal =
                price * quantity;

            total += itemTotal;


            orderText +=
                `${item.name} x ${quantity} - £${itemTotal.toFixed(2)}\n`;

        });


        const noteText =
            note || "No note provided";


        const subject =
            encodeURIComponent(
                "MISK Fragrances - New Order"
            );


        const body =
            encodeURIComponent(

`NEW MISK FRAGRANCES ORDER

Customer Name:
${name}

Customer Email:
${email}

Delivery Address:
${address}

Postcode:
${postcode}

ORDER:

${orderText}

TOTAL:
£${total.toFixed(2)}

ORDER NOTE:
${noteText}

Please contact the customer to arrange payment and delivery.`

            );


        window.location.href =
            `mailto:miskfragrances.uk@gmail.com?subject=${subject}&body=${body}`;

    }
);


/* ==============================
   UPDATE CART IF CHANGED
============================== */

window.addEventListener(
    "storage",
    function(event){

        if(event.key === "miskCart"){

            try{

                cart =
                    JSON.parse(
                        event.newValue
                    ) || [];

            }catch(error){

                cart = [];

            }

            updateCartCount();
            showOrder();

        }

    }
);


/* ==============================
   BACK TO TOP
============================== */

const backToTop =
    document.getElementById("backToTop");


window.addEventListener(
    "scroll",
    function(){

        if(window.scrollY > 400){

            backToTop.classList.add("show");

        }else{

            backToTop.classList.remove("show");

        }

    }
);


/* ==============================
   START
============================== */

updateCartCount();
showOrder();

</script>

</body>
</html>
